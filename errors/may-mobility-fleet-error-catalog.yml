x-findings:
- id: no-error-contract
  severity: high
  detail: 'Twelve distinct failure conditions are described in prose, and not one of
    them has a published HTTP status code, error code or response shape. A client —
    and especially an agent — cannot distinguish "window too long" from "outside
    retention" from "not authorized" programmatically. This is the largest single
    gap in the Fleet API contract.'
- id: in-band-error-sentinel
  severity: medium
  detail: The /last-active endpoint returns an English sentence where a timestamp is
    expected, inside a success payload. Any consumer that assumes a datetime type
    will break on inactive vehicles.
