format: none
format_note: 'May Mobility publishes NO error reference, NO status-code table and NO
  error envelope. There is no RFC 9457 application/problem+json, no error code
  registry and no machine-readable schema. The entries below are the only failure
  conditions the documentation describes anywhere, extracted verbatim from prose
  inside the feature pages. Status codes are recorded as `unknown` because the
  provider does not state them — none have been guessed.'
error_envelope:
  published: false
  note: No error response shape is documented for either the Realtime or the Batch
    surface.
problems:
- id: too-many-topics
  surface: realtime
  status: unknown
  condition: More than 20 topics requested in a single connection or request.
  documented_behaviour: '"the connection will not go through and it will throw an
    error"'
  error_shape: not published
  remediation: Split the subscription across multiple connections, at most 20 topics
    each.
  source: https://docs.maymobility.com/docs/fleet-api/types-of-data
- id: too-many-video-vehicles
  surface: realtime
  status: unknown
  condition: More than 4 vehicles requested for video streaming in a single
    connection or request.
  documented_behaviour: '"the connection will not go through and it will throw an
    error"'
  error_shape: not published
  remediation: Split the video subscription across multiple connections, at most 4
    vehicles each.
  source: https://docs.maymobility.com/docs/fleet-api/video-data-output
- id: vehicle-not-active
  surface: batch
  status: unknown
  condition: A vehicle has not been in service within the last 7 days when queried
    via /last-active.
  documented_behaviour: 'The value for that vehicle in the response object is the
    literal string "vehicle hasn''t been active in the past 7 days" in place of a
    timestamp.'
  error_shape: in-band sentinel string in a success response
  remediation: Treat any non-timestamp value as "unknown / out of retention"; do not
    parse the field as a date unconditionally.
  source: https://docs.maymobility.com/docs/fleet-api/topics-channels/last-active
  note: This is a soft error returned inside a 2xx payload rather than an error
    response, and it is type-unsafe — the same JSON field is either a datetime or an
    English sentence.
- id: no-current-day-data
  surface: batch
  status: unknown
  condition: A Batch request covers the current day.
  documented_behaviour: '"No data is available for the current day via Batch (REST
    endpoints) api, please use Realtime API for that."'
  error_shape: not published
  remediation: Use the Realtime API for same-day data.
  source: https://docs.maymobility.com/docs/fleet-api/types-of-data
- id: window-exceeds-maximum
  surface: batch
