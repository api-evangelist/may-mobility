  condition: The requested startTime/endTime window exceeds 10 minutes.
  documented_behaviour: Documented only as a limit ("The maximum duration you can
    request is 10 minutes"); the failure response is not described.
  error_shape: not published
  remediation: Chunk the request into windows of 10 minutes or less.
  source: https://docs.maymobility.com/docs/fleet-api/types-of-data
- id: outside-retention-window
  surface: batch
  status: unknown
  condition: The requested window is more than 7 days old (telemetry / last-active).
  documented_behaviour: '"We can only retrieve data starting from 7 days ago up to
    the current day."'
  error_shape: not published
  remediation: Retrieve and persist telemetry within the 7-day window.
  source: https://docs.maymobility.com/docs/fleet-api/types-of-data
