- id: status-page-unreachable
  severity: medium
  detail: May Mobility advertises a status page in PeeringDB, but as observed on
    2026-08-01 it cannot be loaded over HTTPS at all — the TLS handshake fails. A
    status page that will not serve is worse than none during an incident, because
    partners will still be pointed at it.
