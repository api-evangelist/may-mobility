distribution_note: 'May Mobility ships first-party generated client packages in four
  languages, but publishes NONE of them to a public registry. The docs state: "May
  protobufs can be accessed from language-specific generated static files that will
  be provided by May Mobility. The files will be plug and play... May Mobility will
  generate the static files in the programming language used by the client." Every
  package above is real and first-party, and every one requires contacting the Fleet
  API team. `install:` is null everywhere because there is no public install command
  to record, and none has been invented.'
scope_note: These packages cover protobuf decoding for the video stream only. There
  is no SDK for the Realtime telemetry WebSocket or the Batch REST API — telemetry is
  delivered as plain JSON (protobuf is decoded server-side since v2.0.0), so those
  surfaces are consumed with a generic HTTP/WebSocket client.
x-findings:
- id: sdks-not-publicly-distributed
  severity: medium
  detail: Four official client packages exist but none is discoverable or installable
    without a vendor conversation. A prospective fleet partner evaluating the Fleet
    API cannot read the protobuf definitions, pin a version, audit the code or
    reproduce a build. The provider states the language list "will be updated" as the
    Fleet API evolves, but the list has been JS/TS, Go, C# and C++ for the whole
    observed period.
- id: no-public-proto
  severity: medium
  detail: 'Only the `quic_wrapper` outer message is published (captured verbatim at
    grpc/may-mobility-quic-wrapper.proto). The inner `May.image_t` message — the one
    a client actually needs to render a frame — is not published in any form.'
