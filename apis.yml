- aid: may-mobility:fleet-batch-api
  name: May Mobility Fleet Batch (REST) API
  description: 'A REST API that returns historical May Mobility vehicle data between
    two Unix timestamps. Telemetry is retrieved per vehicle and topic at
    /vehicles/{vehicleID}/topics/{topicName} with startTime and endTime parameters,
    paginated in 30-second pages via an opaque metaToken carried on subsequent
    requests. Discovery endpoints list available vehicles (/vehicles) and the topics
    available for a vehicle (/vehicles/{vehicleID}/topics). Additional endpoints
    return LiDAR exports as ROSBAG files (/lidar plus a /download step), vehicle shift
    windows (/shift-timing) and vehicle last-active timestamps (/last-active).
    Documented limits: a maximum 10-minute request window, a 7-day retention window,
    no current-day data, and 5-day LiDAR log retention. Authentication is a bearer
    AWS Cognito access token issued with a batch-specific scope.'
  humanURL: https://docs.maymobility.com/docs/fleet-api/types-of-data
  baseURL: https://docs.maymobility.com/docs/fleet-api/types-of-data
