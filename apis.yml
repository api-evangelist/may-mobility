aid: may-mobility
name: May Mobility
description: 'May Mobility is an American autonomous vehicle technology company headquartered
  in Ann Arbor, Michigan, founded in 2017 by Edwin Olson, Alisyn Malek and Steve Vozar.
  It develops and operates self-driving shuttle, microtransit and robotaxi services
  in partnership with cities, transit agencies, commercial sites and ride-hail networks
  including Uber and Lyft, using a proprietary Multi-Policy Decision Making (MPDM)
  autonomy stack. For fleet partners May Mobility publishes a Fleet API at docs.maymobility.com
  consisting of a Realtime API (WebSocket streaming of vehicle telemetry topics and
  exterior camera video, the latter as serialized protobuf) and a Batch REST API that
  returns historical telemetry, LiDAR ROSBAG exports, vehicle shift timings and last-active
  status. Access is provisioned per account by the Fleet API team and authenticated
  with AWS Cognito OAuth 2.0 client-credentials tokens. May Mobility also operates
  its own autonomous system (AS398351) with a public NOC documentation site, peering
  policy, responsible-disclosure program and internal PKI.'
